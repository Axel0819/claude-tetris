name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  # Ediciones rápidas seguidas del mismo issue no lanzan runs solapados
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Evita que un bot (incluido claude[bot] al comentar/etiquetar) dispare el workflow en cascada,
    # y restringe el disparo al owner del repo
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sincronizar labels del proyecto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r l; do
            gh label create "$(jq -r .name <<<"$l")" \
              --color "$(jq -r .color <<<"$l")" \
              --description "$(jq -r .description <<<"$l")" \
              --force
          done

      - name: Analizar issue con Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Mismo secret que ya usan claude.yml y claude-code-review.yml
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/analizar-issue REPO: ${{ github.repository }} ISSUE_NUMBER: ${{ github.event.issue.number }}"
          claude_args: |
            --allowedTools "Read,Glob,Grep,Write,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh api:*)"
            --max-turns 40
